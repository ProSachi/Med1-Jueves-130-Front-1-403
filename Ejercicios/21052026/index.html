<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel futurista de transacciones financieras — estilo Futurama">
  <title>⚡ Futurama — Transacciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-wrapper">

    <!-- ▸ Header -->
    <header class="header">
      <h1 class="header__title">Futurama Ventas</h1>
      <p class="header__subtitle">Sistema de monitoreo de transacciones · año 3026</p>
    </header>

    <!-- ▸ Load Button -->
    <div style="text-align:center;">
      <button id="btn-cargar" class="btn-load">
        <span class="btn-load__icon">⟳</span>
        Cargar datos
      </button>
    </div>

    <!-- ▸ Stats Bar -->
    <div id="stats-bar" class="stats-bar"></div>

    <!-- ▸ Cards Grid -->
    <div id="cards-container" class="cards-grid">
      <div class="empty-state">
        <div class="empty-state__icon">🛸</div>
        <p class="empty-state__text">Presiona "Cargar datos" para iniciar la transmisión</p>
      </div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
